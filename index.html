<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b2027">

<title>白给Turbo · 作品</title>
<meta name="description" content="白给Turbo 的作品名录。全部在浏览器里直接运行，点开就能玩。">

<meta property="og:type" content="website">
<meta property="og:title" content="白给Turbo · 作品">
<meta property="og:description" content="全部在浏览器里直接运行，点开就能玩。">
<meta property="og:url" content="https://freeturbo.github.io/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231b2027'/><g fill='%237dd3fc'><circle cx='16' cy='7' r='4'/><circle cx='24' cy='13' r='3.4'/><circle cx='21' cy='23' r='4'/><circle cx='11' cy='24' r='3.4'/><circle cx='8' cy='13' r='4'/></g></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="page">

  <header class="masthead">
    <h1 id="site-name">白给Turbo</h1>
    <a class="gh" id="site-github" href="https://github.com/FreeTurbo"
       target="_blank" rel="noopener noreferrer">github.com/FreeTurbo</a>
  </header>

  <p class="intro" id="site-intro">点开就能玩。不用下载，也不用注册。</p>

  <div class="status">
    <span class="status-count"><b id="count">—</b> 个作品</span>
    <span class="status-sync">
      <span class="status-dot" id="sync-dot" aria-hidden="true"></span>
      <span id="sync">正在读取</span>
    </span>
  </div>

  <label class="search" id="search-box" hidden>
    <input type="search" id="search" placeholder="在作品里找…" autocomplete="off"
           aria-label="在作品里找">
  </label>

  <main class="list" id="list" aria-live="polite"></main>

  <footer class="foot">
    <span>共 <b id="foot-count">—</b> 个作品，新作品自动出现</span>
    <span>© <span id="year">2026</span> <span id="site-brand">白给Turbo</span></span>
  </footer>

</div>

<noscript>
  <div style="max-width:34rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;
              line-height:1.7;color:#8d97a3">
    这个页面需要 JavaScript 才能自动读取作品列表。<br>
    直接打开 <a href="https://github.com/FreeTurbo?tab=repositories"
              style="color:#7dd3fc">github.com/FreeTurbo</a> 可以看到全部仓库。
  </div>
</noscript>

<script src="assets/app.js"></script>
</body>
</html>
